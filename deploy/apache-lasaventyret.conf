# /etc/apache2/sites-available/lasaventyret.conf
# OBS: IP-baserad vhost (inte *:80), annars fångar temperatur.nu-vhosten anropen.
# Samma <Directory>/<FilesMatch>-block ska in i lasaventyret-le-ssl.conf (certbot skapade den).
<VirtualHost 159.89.22.162:80>
    ServerName lasaventyret.elf98.com
    DocumentRoot /var/www/lasaventyret
    <Directory /var/www/lasaventyret>
        Options -Indexes
        AllowOverride None
        Require all granted
        # SPA: allt som inte är en fil går till index.html
        FallbackResource /index.html
    </Directory>
    # Mottagaren för egna inspelningar (upload-recording.php) körs i php-fpm.
    # recorded/ måste vara skrivbar för www-data: chgrp www-data + g+w (deploy.ps1 gör det).
    <FilesMatch "^upload-recording\.php$">
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>
    # Service worker och manifest ska aldrig cachas hårt
    <FilesMatch "^(sw\.js|manifest\.webmanifest|index\.html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    # Ljudfiler (mp3 och klippta wav), inspelningar och hashade assets kan cachas länge: URL:en bär en hash
    <LocationMatch "^/(audio/.*\.(mp3|wav)|recorded/.*\.wav|assets/)">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # Indexen ska revalideras
    <LocationMatch "^/(audio/manifest\.json|recorded/index\.json)$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/lasaventyret-error.log
    CustomLog ${APACHE_LOG_DIR}/lasaventyret-access.log combined
</VirtualHost>
